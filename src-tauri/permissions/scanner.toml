[[permission]]
identifier = "allow-scan"
description = "Izinkan frontend memanggil fungsi scan_music_folder dan read_lrc_file"
commands.allow = ["scan_music_folder", "read_lrc_file"]

[[permission]]
identifier = "allow-audio-read"
description = "Allows reading audio files and covers from external drives"
[[permission.scope.allow]]
path = "$APPLOCALDATA/covers/*"
[[permission.scope.allow]]
path = "D:/**/*"
[[permission.scope.allow]]
path = "C:/**/*"

[[set]]
identifier = "app-full-access"
description = "Full access for the application commands and assets"
permissions = ["allow-scan", "allow-audio-read"]